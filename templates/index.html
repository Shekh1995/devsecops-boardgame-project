<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Board Game Library</title><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>Board Game Library</h1><p>A production-style Flask DevSecOps demo.</p><div id="games">Loading games…</div></main><script>fetch('/api/games').then(r=>r.json()).then(d=>document.querySelector('#games').innerHTML=d.games.map(g=>`<article><b>${g.name}</b><span>${g.category} · ${g.players} players</span></article>`).join(''))</script></body></html>
