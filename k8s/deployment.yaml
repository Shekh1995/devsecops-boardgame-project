apiVersion: apps/v1
kind: Deployment

metadata:
  name: boardgame-api
  namespace: boardgame

spec:
  replicas: 2

  selector:
    matchLabels:
      app: boardgame-api

  template:
    metadata:
      labels:
        app: boardgame-api

    spec:

      # Security context for the Pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      containers:

        - name: boardgame-api

          # Jenkins replaces this value with:
          # shekhar013/boardgame-app:<BUILD_NUMBER>
          image: IMAGE_PLACEHOLDER

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Container security
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi

          # Readiness probe
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 6

          # Liveness probe
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP

            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 5
